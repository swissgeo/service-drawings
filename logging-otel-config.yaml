version: 1
disable_existing_loggers: False

root:
  handlers:
    - otel
    - console
  level: DEBUG
  propagate: True

loggers:
  uvicorn.access:
    level: INFO
  botocore:
    level: INFO
  aiobotocore:
    level: INFO

formatters:
  standard:
    format: "[%(asctime)s] %(levelname)-8s - %(name)-26s : %(message)s"

handlers:
  otel:
    (): app.otel.get_otel_handler
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

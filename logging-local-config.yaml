version: 1
disable_existing_loggers: False

root:
  handlers:
    - console
  level: DEBUG
  propagate: True

loggers:
  uvicorn.access:
    level: INFO
    # Because uvicorn is already calling logging.basicConfig(), we need to override the console
    # handler
    handlers:
      - console
  botocore:
    level: INFO
  aiobotocore:
    level: INFO

formatters:
  standard:
    format: "[%(asctime)s] %(levelname)-8s - %(name)-26s : %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

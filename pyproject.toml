[project]
name = "service-drawings"
description = "Web-portal drawings management service."
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]

#===============================================================================
# Dependencies
dependencies = [
    "aioboto3~=15.5",
    "fastapi[standard]~=0.135",
    # List of available opentelemetry-instrumentation can be found here
    # https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation#readme
    "httptools>=0.8.0",
    "opentelemetry-exporter-otlp~=1.41",
    "opentelemetry-instrumentation-asgi==0.62b1",     # asgi is used by fastapi
    "opentelemetry-instrumentation-botocore==0.62b1",
    "opentelemetry-instrumentation-fastapi==0.62b1",
    "opentelemetry-sdk~=1.41",
    "orjson~=3.11",
    "pydantic-settings~=2.13",
    "pyyaml~=6.0",
    "types-aiobotocore[dynamodb,s3]~=3.4",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,s3]~=1.42",
    "httpx~=0.28",
    "moto[dynamodb,s3,server]~=5.1",
    "pre-commit~=4.5",
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "pytest-cov~=7.1",
    "pytest-xdist~=3.8",
    "ruff~=0.15",
    "ty~=0.0",
]

#===============================================================================
# uv configuration
[tool.uv]
package = false # Do not install as a package

#===============================================================================
# FastAPI configuration
[tool.fastapi]
entrypoint = "app.main:app"

#===============================================================================
# Ruff configuration
[tool.ruff]
src = ["app"]

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.14
target-version = "py314"

#------------------------------------------------------------------------------
# Linting configuration
[tool.ruff.lint]
exclude = []
select = ["ALL"]
ignore = [
    "ANN401", # Ignore Any typehint
    "ANN002", # Ignore typehint for *args
    "ANN003", # Ignore typehint for **kwargs
    "D",      # Ignore pydocstyle
    "EM",     # Ignore flake8-errmsg
    "FBT001", # Ignore boolean-type-hint-positional-argument
    "FBT002", # Ignore boolean-default-value-positional-argument
    "PTH123", # Ignore builtin-open
    "TD",     # Ignore flake8-todos
    "FIX",    # Ignore fixme comments
    "ERA001", # TODO remove this for production, ignore commented code
    "COM812", # flak8-commas missing-trailing-comma is ignored to avoid conflict with formatter which enforces trailing commas
    "TRY003", # Ignore long messages in exceptions

    # Pydantic schemas uses type annotations at runtime to generate the openapi
    # and do the validation. Putting the type annotation in a TYPE_CHECKING
    # block creates weird hard to debug code.
    # Same for fastAPI dependencies which also use type annotations at runtime.
    "TC003", # Ignore type annotation not in TYPE_CHECKING block
    "TC002", # Ignore type annotation not in TYPE_CHECKING block for third party import
    "TC001", # Ignore type annotation not in TYPE_CHECKING block for first party import
]

# Allow fix for all enabled rules (when `--fix`) is provided.
unfixable = []

fixable = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

#------------------------------------------------------------------------------
# ruff ignore per files
[tool.ruff.lint.per-file-ignores]


"app/tests/**" = [
    "S101",    # Ignore usage of assert statements in tests
    "ANN201",  # Ignore missing return type hints in tests
    "PLR2004", # Ignore magic number in tests
    "PLR0913", # Ignore too many arguments in function in tests
]

#------------------------------------------------------------------------------
# Isort configuration
[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "fastapi",
    "test",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
test = ["pytest"]
fastapi = ["fastapi", "pydantic"]

#===============================================================================
# ty configuration
[tool.ty.environment]

[tool.ty.src]
exclude = []

#===============================================================================
# Pytest configuration
[tool.pytest]
pythonpath = ["app"]
python_files = ["test_*.py"]
addopts = []

#==============================================================================
# Coverage configuration
[tool.coverage.run]
omit = ["*/tests/*", "version.py", "otel.py"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover"]
